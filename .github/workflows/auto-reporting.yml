name: Automated Reporting Sync

on:
  schedule:
    # Backup reconciler for Microsoft Graph webhooks.
    # Webhooks handle near real-time updates; this keeps subscriptions fresh
    # and catches missed notifications without using Vercel Cron.
    - cron: '*/15 * * * *'
  workflow_dispatch:
    # Allows manual trigger from GitHub UI for testing

concurrency:
  group: automated-reporting-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Delta Scan
        run: |
          if [ -z "${{ secrets.APP_URL }}" ]; then
            echo "Error: APP_URL secret is not set. Please add it to your GitHub repository secrets."
            exit 1
          fi
          
          echo "Triggering scan on ${{ secrets.APP_URL }}..."
          
          curl --fail --show-error --silent --retry 3 --retry-delay 10 \
            -X POST "${{ secrets.APP_URL }}/api/graph/delta" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json"
